<div id='write'  class=''><h1><a name="config-options" class="md-header-anchor"></a><span>Config Options</span></h1><p><span>For the JSON formatted variables, please keep these in mind:</span></p><ul><li><span>JSON strings must be double-quoted (&quot;); single quotes (&#39;) will be rejected by JSON parser</span></li><li><span>The last line of arrays/objects may NOT have a trailing comma</span></li><li><span>No comments whatsoever</span></li></ul><p>&nbsp;</p><figure><table><thead><tr><th><span>Name</span></th><th><span>Type</span></th><th><span>Default</span></th><th><span>Remarks</span></th></tr></thead><tbody><tr><td><span>DEBUG_LEVEL</span></td><td><span>enum</span></td><td><span>ERROR</span></td><td><span>Level of output messages in the Script Log (aka Output Log) shown by the script.</span><br><br><span>Unless you are adventurous, do not set it above WARN, i.e. NORMAL, INFO, VERBOSE emita ton of information and might freeze your PC/DOpus.</span><br><br><span>The log can be opened by via:</span><br><span>* View -&gt; Output Window</span><br><span>* by the command </span><code>Set UTILITY=OtherLog,Toggle</code><br><span>* by opening Find, Synchronize, etc. and choosing &quot;Other Log&quot; in the &quot;Utility Panel&quot; dropdown</span></td></tr><tr><td><span>FORCE_REFRESH_AFTER_UPDATE</span></td><td><span>boolean</span></td><td><span>true</span></td><td><span>Automatically refresh the current lister after changes.</span><br><br><span>It keeps the current selection.</span></td></tr><tr><td><span>MEDIAINFO_PATH</span></td><td><span>string</span></td><td><span>/programfilesx86/MediaInfo/MediaInfo.exe</span></td><td><span>Path to MediaInfo portable CLI.</span><br><br><span>It can be downloaded from </span><a href='https://mediaarea.net/en/MediaInfo/Download/Windows'><span>https://mediaarea.net/en/MediaInfo/Download/Windows</span></a></td></tr><tr><td><span>TEMP_FILES_DIR</span></td><td><span>string</span></td><td><span>%TEMP%</span></td><td><span>Temporary directory, in which temporary JSON outputs from MediaInfo are stored.</span><br><br><span>They are immediately deleted after a file has been processed.</span><br><br><span>This is ignored in Templess Mode (see below).</span></td></tr><tr><td><span>TEMPLESS_MODE</span></td><td><span>boolean</span></td><td><span>false</span></td><td><em><span>Experimental:</span></em><br><br><span>In this mode, MediaInfo outputs are read into the script without using temporary files.</span><br><br><span>This is a highly experimental feature and uses temporary (volatile) environment variables to pass the data from the command output to DOpus.</span><br><br><span>If you are lucky, it might work just as fast as, if not faster than the normal mode using temp-files. If not, disable it again.</span></td></tr><tr><td><span>TEMPLESS_CHUNK_SIZE</span></td><td><span>number</span></td><td><span>32768</span></td><td><span>Experimental:</span><br><br><span>Determines how big the chunks, i.e. volatile envvar blocks, should be. Windows has certain limitations on command line and envvar lengths. If templess mode works mostly for you, you can increase the value even further.</span><br><br><span>The default value is chosen very conservatively.</span></td></tr><tr><td><span>KEEP_ORIG_MODTS</span></td><td><span>boolean</span></td><td><span>true</span></td><td><span>Attaching ADS to files normally changes the </span><em><span>last modification</span></em><span> timestamps of the parent file.</span><br><br><span>* true: The script automatically resets the timestamp to original.</span><br><span>* false: The parent files&#39; modification timestamp is changed.</span></td></tr><tr><td><span>CACHE_ENABLED</span></td><td><span>boolean</span></td><td><span>true</span></td><td><span>Cache metadata JS objects in memory for unchanged files to speed up process.</span><br><br><span>The information stored in ADS is usually small, typically ~1 KB per file, but I cannot guarantee how much memory management overhead Windows/WSH/JScript/DOpus put on top of each object. The cache is used only and only if this script runs, i.e. automatically when any of the columns is visible (incl. in InfoTips/Tiles), or if you trigger a command.</span><br><br><span>To ensure the information is always up-to-date, the following algorithm is used:</span><br><br><span>* Caching disabled or file is not in cache =&gt; read from disk</span><br><br><span>* File is already in cache =&gt; check file&#39;s last modification time against the timestamp in cached info</span><br><span> * If different =&gt; read from disk</span><br><span> * If same =&gt; use cache</span><br><span>* UPDATE command executed (regardless of file was in cache or not) =&gt; add to/update cache</span><br><span>* File is already in cache but DELETE command is executed =&gt; remove from cache</span><br><br><span>WARNING:</span><br><br><span>The cache will fail for one particular scenario:</span><br><br><span>Say, you have a file and you copy it to another folder. If the copy is processed, its information will be cached. If you delete the copy via DOpus (or some other program), the script will not receive this information automatically. If you copy the original file, which has the exact same file size &amp; modification timestamp, to the same path again, the new copy will have no ADS but the script will still think that the it is the previously processed file and show the information from the cache. Normally this is not a problem for displaying purposes, but if you copy the copy to another drive, it will have no ADS. If you do this, you should either manually update the 2nd copy, or delete the cache to see that the copy has no ADS.</span><br><br><span>Please keep this in mind.</span><br><br><span>CAVEATS:</span><br><br><span>If you keep DOpus open for a long time and handle thousands of small files (only when any of these extra columns is shown), the memory usage of DOpus will increase. This is not a &#39;memory leak&#39; though, just the script doing what you tell it to: To cache stuff :)</span><br><br><span>To avoid high mem usage you can manually call the CLEARCACHE command via button, menu...</span></td></tr><tr><td><span>TOGGLEABLE_FIELDS_ESSENTIAL</span></td><td><span>string[] as json</span></td><td><span>[</span><br><span>  &quot;MExt_HasMetadata&quot;,</span><br><span>  &quot;MExt_NeedsUpdate&quot;,</span><br><span>  &quot;MExt_TotalBitrate&quot;,</span><br><span>  &quot;MExt_VideoCodec&quot;,</span><br><span>  &quot;MExt_VideoBitrate&quot;,</span><br><span>  &quot;MExt_AudioCodec&quot;,</span><br><span>  &quot;MExt_AudioBitrate&quot;,</span><br><span>  &quot;MExt_CombinedDuration&quot;,</span><br><span>  &quot;MExt_VDimensions&quot;,</span><br><span>  &quot;MExt_VResolution&quot;,</span><br><span>  &quot;MExt_VFrameRate&quot;,</span><br><span>  &quot;MExt_VARCombined&quot;,</span><br><span>  &quot;MExt_MultiAudio&quot;,</span><br><span>  &quot;MExt_AudioChannels&quot;,</span><br><span>  &quot;MExt_AudioLang&quot;,</span><br><span>  &quot;MExt_AudioBitrateMode&quot;,</span><br><span>  &quot;MExt_AudioCompressionMode&quot;,</span><br><span>  &quot;MExt_HasReplayGain&quot;,</span><br><span>  &quot;MExt_VBitratePerPixel&quot;,</span><br><span>  &quot;MExt_SubtitleLang&quot;</span><br><span>]</span></td><td><em><span>Essential</span></em><span> columns list, which can be toggled on/off via supplied button (default icon: 1).</span><br><br><span>The list is ordered, i.e. they are added/removed in the same order as configured.</span><br><br><span>Unlike the list might suggest, you can use any DOpus field in this list, e.g. mix and match standard movie/audio fields from DOpus.</span><br><br><span>Also see the next setting TOGGLEABLE_FIELDS_ESSENTIAL_AFTER.</span></td></tr><tr><td><span>TOGGLEABLE_FIELDS_ESSENTIAL_AFTER</span></td><td><span>string</span></td><td><span>Comments</span></td><td><span>The column name after which the </span><em><span>Essential</span></em><span> fields are added to/removed from.</span></td></tr><tr><td><span>TOGGLEABLE_FIELDS_OPTIONAL</span></td><td><span>string[] (as json)</span></td><td><span>[</span><br><span>    &quot;MExt_GrossByterate&quot;,</span><br><span>    &quot;MExt_TotalDuration&quot;,</span><br><span>    &quot;MExt_VideoDuration&quot;,</span><br><span>    &quot;MExt_AudioDuration&quot;,</span><br><span>    &quot;MExt_VARDisplay&quot;,</span><br><span>    &quot;MExt_VARRaw&quot;,</span><br><span>    &quot;MExt_VideoCount&quot;,</span><br><span>    &quot;MExt_AudioCount&quot;,</span><br><span>    &quot;MExt_TextCount&quot;,</span><br><span>    &quot;MExt_OthersCount&quot;,</span><br><span>    &quot;MExt_VEncLibName&quot;,</span><br><span>    &quot;MExt_VEncLib&quot;,</span><br><span>    &quot;MExt_VCodecID&quot;,</span><br><span>    &quot;MExt_ACodecID&quot;,</span><br><span>    &quot;MExt_AFormatVersion&quot;,</span><br><span>    &quot;MExt_AProfile&quot;,</span><br><span>    &quot;MExt_EncoderApp&quot;,</span><br><span>    &quot;MExt_DateEncoded&quot;,</span><br><span>    &quot;MExt_DateTagged&quot;,</span><br><span>]</span></td><td><em><span>Optional</span></em><span> columns list, which can be toggled on/off via supplied button (default icon: 2).</span><br><br><span>The rest as in </span><em><span>Essential</span></em><span> fields above.</span></td></tr><tr><td><span>TOGGLEABLE_FIELDS_OPTIONAL_AFTER</span></td><td><span>string</span></td><td><span>MExt_SubtitleLang</span></td><td><span>The column name after which the </span><em><span>Optional</span></em><span> fields are added to/removed from.</span></td></tr><tr><td><span>TOGGLEABLE_FIELDS_OTHER</span></td><td><span>string[] (as json)</span></td><td><span>[</span><br><span>    &quot;MExt_HelperContainer&quot;,</span><br><span>    &quot;MExt_HelperVideoCodec&quot;,</span><br><span>    &quot;MExt_HelperAudioCodec&quot;,</span><br><span>    &quot;MExt_CleanedUpName&quot;,</span><br><span>]</span></td><td><em><span>Other</span></em><span> columns list, which can be toggled on/off via supplied button (default icon: 3).</span><br><br><span>These fields are usually unnecessary for daily usage..</span><br><br><span>The rest as in </span><em><span>Essential</span></em><span> fields above.</span></td></tr><tr><td><span>TOGGLEABLE_FIELDS_OTHER_AFTER</span></td><td><span>string</span></td><td><none></td><td><span>The column name after which the </span><em><span>Other</span></em><span> fields are added to/removed from.</span></td></tr><tr><td><span>TOGGLEABLE_FIELDS_VERBOSE</span></td><td><span>string[] (as json)</span></td><td><span>[</span><br><span>    &quot;MExt_ADSDataFormatted&quot;,</span><br><span>    &quot;MExt_ADSDataRaw&quot;,</span><br><span>]</span></td><td><span>Verbose columns list, which can be toggled on/off via supplied button (default icon: 4).</span><br><br><span>These fields are usually unnecessary for daily usage..</span><br><br><span>The rest as in </span><em><span>Essential</span></em><span> fields above.</span></td></tr><tr><td><span>TOGGLEABLE_FIELDS_VERBOSE_AFTER</span></td><td><span>string</span></td><td><none></td><td><span>The column name after which the </span><em><span>Verbose</span></em><span> fields are added to/removed from.</span></td></tr><tr><td><span>CODEC_USE_SHORT_VARIANT</span></td><td><span>boolean</span></td><td><span>false</span></td><td><span>Use short variants of codecs, found via LOOKUP_CODECS</span></td></tr><tr><td><span>CODEC_APPEND_ADDINFO</span></td><td><span>boolean</span></td><td><span>true</span></td><td><span>Add container or codec-specific information to the container/video/audio codec fields automatically.</span><br><span>If an AAC file is encoded with &#39;LC SBR&#39; it is shown as &#39;AAC (LC SPR)&#39;.</span></td></tr><tr><td><span>RESOLUTION_APPEND_VERTICAL</span></td><td><span>boolean</span></td><td><span>true</span></td><td><span>Append &#39;(Vertical)&#39; to video resolutions or not, mostly relevant for mobile phone videos.</span><br><br><em><span>Example: A file with with 480x640 resolution, will be shown as 480p (Vertical).</span></em></td></tr><tr><td><span>FORMATS_REGEX_VBR</span></td><td><span>regexp (as string)</span></td><td><span>/ALAC</span><span>|</span><span>Monkey&#39;s Audio</span><span>|</span><span>TAK</span><span>|</span><span>DSD/</span></td><td><span>Audio formats which do not store a VBR/CBR/ABR information separately but are VBR by definition.</span><br><em><span>Do not change unless necessary.</span></em></td></tr><tr><td><span>FORMATS_REGEX_LOSSLESS</span></td><td><span>regexp (as string)</span></td><td><span>/ALAC</span><span>|</span><span>PCM</span><span>|</span><span>TTA</span><span>|</span><span>DSD/</span></td><td><span>Audio formats which do not store a lossless information separately but are lossless by definition.</span><br><br><em><span>Do not change unless necessary.</span></em></td></tr><tr><td><span>FORMATS_REGEX_LOSSY</span></td><td><span>regexp (as string)</span></td><td><span>/AMR/</span></td><td><span>Audio formats which do not store a lossy information separately but are lossy by definition.</span><br><br><em><span>Do not change unless necessary.</span></em></td></tr><tr><td><span>LOOKUP_RESOLUTIONS</span></td><td><span>&lt;string, string&gt; (as json)</span></td><td><span>{</span><br><span>    &quot;240&quot;:      &quot;240p&quot;,</span><br><span>    &quot;360&quot;:      &quot;360p&quot;,</span><br><span>    &quot;480&quot;:      &quot;480p&quot;,</span><br><span>    &quot;576&quot;:      &quot;576p&quot;,</span><br><span>    &quot;720&quot;:      &quot;720p&quot;,</span><br><span>    &quot;1080&quot;:     &quot;1080p&quot;,</span><br><span>    &quot;2160&quot;:     &quot;2160p&quot;,</span><br><span>    &quot;4320&quot;:     &quot;4320p&quot;</span><br><span>}</span></td><td><span>Video resolution translation hash. These are also used for grouping. For calculation always, the smaller of width/height is taken. Also see RESOLUTION_APPEND_VERTICAL. </span><br><br><span>The comparison is always &lt;= (less or equal), i.e.</span><br><em><span>actual resolution &lt;= config values</span></em><br><br><span>Alternatively, you can use SD, HD-Ready, HD, UHD, 4K, 8K, etc.</span><br><br><em><span>Example: A file with with 640x480 resolution, will be shown as 480p.</span></em></td></tr><tr><td><span>LOOKUP_DURATION_GROUPS</span></td><td><span>&lt;string, string&gt; (as json)</span></td><td><span>{</span><br><span>    &quot;0&quot;:        &quot; ≠00:00&quot;,</span><br><span>    &quot;60&quot;:       &quot;&lt; 01:00&quot;,</span><br><span>    &quot;120&quot;:      &quot;01:00-02:00&quot;,</span><br><span>    &quot;180&quot;:      &quot;02:00-03:00&quot;,</span><br><span>    &quot;240&quot;:      &quot;03:00-04:00&quot;,</span><br><span>    &quot;300&quot;:      &quot;04:00-05:00&quot;,</span><br><span>    &quot;600&quot;:      &quot;05:00-10:00&quot;,</span><br><span>    &quot;900&quot;:      &quot;10:00-15:00&quot;,</span><br><span>    &quot;1200&quot;:     &quot;15:00-20:00&quot;,</span><br><span>    &quot;1800&quot;:     &quot;20:00-30:00&quot;,</span><br><span>    &quot;3600&quot;:     &quot;30:00-1:00:00&quot;,</span><br><span>    &quot;5400&quot;:     &quot;Over 1h&quot;,</span><br><span>    &quot;7200&quot;:     &quot;Over 1.5h&quot;,</span><br><span>    &quot;10800&quot;:    &quot;Over 2h&quot;,</span><br><span>    &quot;999999&quot;:   &quot;Over 3h&quot;</span><br><span>}</span></td><td><span>Duration lookup hash. These are also used for grouping.</span><br><br><span>The comparison is always &lt;= (less or equal), i.e.</span><br><em><span>actual duration &lt;= config values</span></em><br><br><span>Some raw files extracted from movie containers, notably raw AAC (not M4A), raw DTS, raw Atmos are reported as having a 0 duration by MediaInfo. But if the file definitely has audio, you can recognize this as well.</span><br><br><span> \u2260 is the Unicode &#39;not equal&#39; sign.</span><br><span> </span><br><span>If the file has no audio track at all, this is grouped automatically under &#39;No Audio&#39;, no need to define it here.</span><br><br><span>Also note that some values like &#39;Over 1h&#39; depend on preceeding key&#39;s value</span></td></tr><tr><td><span>LOOKUP_CODECS</span></td><td><span>&lt;string, string&gt; (as json)</span></td><td><em><span>see below</span></em></td><td>&nbsp;</td></tr><tr><td><span>LOOKUP_CHANNELS</span></td><td><span>&lt;string, string&gt; (as json)</span></td><td><span>{</span><br><span>    &quot;0&quot;: &quot; &quot;,</span><br><span>    &quot;X&quot;: &quot;≠0&quot;,</span><br><span>    &quot;1&quot;: &quot;1.0&quot;,</span><br><span>    &quot;2&quot;: &quot;2.0&quot;,</span><br><span>    &quot;3&quot;: &quot;2.1&quot;,</span><br><span>    &quot;4&quot;: &quot;4.0&quot;,</span><br><span>    &quot;5&quot;: &quot;5.0&quot;,</span><br><span>    &quot;6&quot;: &quot;5.1&quot;,</span><br><span>    &quot;7&quot;: &quot;5.2&quot;,</span><br><span>    &quot;8&quot;: &quot;7.1&quot;,</span><br><span>    &quot;9&quot;: &quot;7.2&quot;</span><br><span>}</span></td><td><span>0 means file has no audio track</span><br><span>X: means file has an audio track, but its channel information cannot be extracted by MediaInfo. Some formats like Musepack, raw DTS report an audio track but not the channel count, sorted between 0 &amp; 1.</span><br><br><span>Some alternatives for 0:</span><br><span>* &quot;0&quot;: &quot;0 (no audio)&quot;</span><br><span>* &quot;0&quot;: &quot;0 (n/a)&quot;</span><br><span>* &quot;0&quot;: &quot;0&quot;</span><br><span>If you use &quot;0&quot;: &quot;&quot; the value 0 will be shown as empty string as well, which impacts sorting.</span><br><br><span>Some alternatives for X:</span><br><span>* &quot;X&quot;: &quot;&gt; 0&quot;,</span><br><span>* &quot;X&quot;: &quot;≠ 0&quot;</span></td></tr><tr><td><span>NAME_CLEANUP</span></td><td>&nbsp;</td><td>&nbsp;</td><td><span>Currently only for internal use.</span></td></tr></tbody></table></figure><p>&nbsp;</p><style>
#write {
    max-width: unset;
}
@media only screen and (min-width: 1400px) {
	#write {
		max-width: unset !important;;
	}
}
@media only screen and (min-width: 1800px) {
	#write {
		max-width: unset !important;;
	}
}
</style></div>
